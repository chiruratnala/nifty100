# Nifty 100 Screener Engine Configuration
presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, low debt, positive cash generation with steady 5-year revenue compounding."
    filters:
      return_on_equity_pct_min: 15.0
      debt_to_equity_max: 1.0
      free_cash_flow_cr_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Reasonably valued stocks with moderate leverage and positive dividend yield."
    filters:
      pe_ratio_max: 25.0
      pb_ratio_max: 4.0
      debt_to_equity_max: 2.0
      dividend_yield_pct_min: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High-growth earnings and revenue compounding with manageable debt levels."
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      debt_to_equity_max: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "High dividend yield supported by sustainable payout ratios and positive free cash flows."
    filters:
      dividend_yield_pct_min: 2.0
      dividend_payout_ratio_pct_max: 80.0
      free_cash_flow_cr_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero debt or net cash companies with large revenue scale and high returns on equity."
    filters:
      debt_to_equity_max: 0.05
      return_on_equity_pct_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Improving operational trajectory with positive FCF and declining balance sheet leverage."
    filters:
      revenue_cagr_3yr_min: 10.0
      free_cash_flow_cr_min: 0.0
      de_declining_yoy: true

composite_weights:
  profitability:
    weight: 0.35
    components:
      return_on_equity_pct: 0.15
      return_on_capital_employed_pct: 0.10
      net_profit_margin_pct: 0.10
  cash_quality:
    weight: 0.30
    components:
      fcf_cagr_5yr: 0.15
      cfo_to_pat_ratio: 0.10
      fcf_positive_flag: 0.05
  growth:
    weight: 0.20
    components:
      revenue_cagr_5yr: 0.10
      pat_cagr_5yr: 0.10
  leverage:
    weight: 0.15
    components:
      debt_to_equity: 0.10
      interest_coverage: 0.05
